plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.16.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.github.bonigarcia:webdrivermanager:5.6.2'
    implementation 'com.squareup:javapoet:1.13.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dev.vfyjxf.taffy.gentest.TestGenerator'
}

tasks.named('test') {
    useJUnitPlatform()
}

def fixtureRoot = providers.gradleProperty('taffyFixtureRoot')
    .orElse(providers.environmentVariable('TAFFY_FIXTURE_ROOT'))
    .orNull
def generatedTestRoot = providers.gradleProperty('generatedTestRoot')
    .orElse(providers.environmentVariable('TAFFY_GENERATED_TEST_ROOT'))
    .orNull
def configuredChromeBinary = providers.gradleProperty('chromeBinary')
    .orElse(providers.environmentVariable('CHROME_BINARY'))
    .orNull
def configuredChromeDriver = providers.gradleProperty('chromeDriver')
    .orElse(providers.environmentVariable('CHROME_DRIVER'))
    .orNull
def fixtureCategory = providers.gradleProperty('taffyFixtureCategory')
    .orElse(providers.environmentVariable('TAFFY_FIXTURE_CATEGORY'))
    .orNull

def fixtureGeneratorArgs = {
    if (fixtureRoot == null) {
        throw new GradleException('Set -PtaffyFixtureRoot or TAFFY_FIXTURE_ROOT to the Rust Taffy test_fixtures directory.')
    }
    def configuredArgs = ['--fixturesRoot', fixtureRoot]
    if (generatedTestRoot != null) configuredArgs += ['--outputRoot', generatedTestRoot]
    if (configuredChromeBinary != null) configuredArgs += ['--chromeBinary', configuredChromeBinary]
    if (configuredChromeDriver != null) configuredArgs += ['--chromeDriver', configuredChromeDriver]
    if (fixtureCategory != null) configuredArgs += ['--category', fixtureCategory]
    return configuredArgs
}

tasks.named('run') {
    workingDir = rootProject.projectDir
    doFirst {
        args = fixtureGeneratorArgs()
    }
}

tasks.register('generateTaffyFixtures', JavaExec) {
    group = 'generate'
    description = 'Generate Java tests from the configured Rust Taffy fixture directory'
    mainClass = 'dev.vfyjxf.taffy.gentest.TestGenerator'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
    doFirst {
        args = fixtureGeneratorArgs()
    }
}

// Task to generate only the WPT flex aspect-ratio tests
tasks.register('genWptFixtures', JavaExec) {
    group = 'generate'
    description = 'Generate Java tests from WPT-converted fixture files only'
    mainClass = 'dev.vfyjxf.taffy.gentest.TestGenerator'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir.parentFile
    
    def chromeBin = new File(rootProject.projectDir.parentFile, 'chrome/chrome-win64/chrome.exe').absolutePath
    def chromeDriverBin = new File(rootProject.projectDir.parentFile, 'chrome/chromedriver-win64/chromedriver.exe').absolutePath
    
    args = [
        '--chromeBinary', chromeBin,
        '--chromeDriver', chromeDriverBin,
        '--category', 'flex_aspect_ratio'
    ]
}
// Task to convert WPT HTML to taffy fixture format
tasks.register('convertWptToFixtures', JavaExec) {
    group = 'generate'
    description = 'Convert WPT HTML tests to taffy fixture format'
    mainClass = 'dev.vfyjxf.taffy.gentest.WptToFixtureConverter'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir.parentFile
    
    def wptDir = new File(rootProject.projectDir.parentFile, 'css/css-sizing/aspect-ratio').absolutePath
    def outputDir = new File(rootProject.projectDir.parentFile, 'taffy/test_fixtures/flex_aspect_ratio').absolutePath
    
    args = [
        wptDir,
        outputDir,
        '--prefix', 'wpt_',
        '--pattern', 'flex-aspect-ratio-*.html'
    ]
}

// Task to regenerate WPT tests
tasks.register('genWpt', JavaExec) {
    group = 'generate'
    description = 'Generate WPT tests from CSS test suite'
    mainClass = 'dev.vfyjxf.taffy.gentest.WptTestGenerator'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir.parentFile
    
    def wptRoot = rootProject.projectDir.parentFile.absolutePath
    def cssRoot = rootProject.projectDir.parentFile.absolutePath
    def outRoot = new File(rootProject.projectDir, 'src/test/java').absolutePath
    def chromeBin = new File(rootProject.projectDir.parentFile, 'chrome/chrome-win64/chrome.exe').absolutePath
    def chromeDriverBin = new File(rootProject.projectDir.parentFile, 'chrome/chromedriver-win64/chromedriver.exe').absolutePath
    
    args = [
        '--wptRoot', wptRoot,
        '--cssRoot', cssRoot,
        '--outRoot', outRoot,
        '--discover',
        '--suites', 'css/css-sizing/aspect-ratio',
        '--chromeBinary', chromeBin,
        '--chromeDriver', chromeDriverBin
    ]
}
